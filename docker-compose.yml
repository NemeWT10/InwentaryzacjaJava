services:
  mysql:
    image: mysql:8.0
    container_name: inwentaryzacja-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: inwentaryzacja
      MYSQL_USER: inwentaryzacja
      MYSQL_PASSWORD: inwentaryzacjapass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
