# Testy działają na bazie H2 w pamięci, bez Dockera.
spring.datasource.url=jdbc:h2:mem:inwentaryzacja;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
server.error.include-message=always

# Klucz do podpisywania tokenow JWT (HS256, co najmniej 32 znaki). Poza komputerem deweloperskim ustaw JWT_SECRET.
jwt.secret=${JWT_SECRET:inwentaryzacja-dev-secret-zmien-przed-wdrozeniem}
jwt.validity-hours=8
