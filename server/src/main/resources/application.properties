spring.application.name=inwentaryzacja-server

spring.datasource.url=jdbc:mysql://localhost:3306/inwentaryzacja?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=inwentaryzacja
spring.datasource.password=inwentaryzacjapass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always

# Klucz do podpisywania tokenow JWT (HS256, co najmniej 32 znaki). Poza komputerem deweloperskim ustaw JWT_SECRET.
jwt.secret=${JWT_SECRET:inwentaryzacja-dev-secret-zmien-przed-wdrozeniem}
jwt.validity-hours=8
